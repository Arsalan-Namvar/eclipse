name: check

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install verification dependencies
        run: sudo apt-get update && sudo apt-get install -y lua5.4 python3-gi gir1.2-nm-1.0

      - name: Verify Python, Lua, Bash, JSON and TOML syntax
        run: ./setup check

      - name: Verify backend and keyboard migration behavior
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v
          lua5.4 tests/test_keymap.lua
